[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluent-data-studio-engine"
version = "0.1.0"
description = "The analysis engine of Fluent Data Studio: connectors, typed transformations, chart specs and validated AI plans on DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["duckdb>=1.1", "openpyxl>=3.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
fluent-data-studio-cli = "fluent_data_studio.cli:main"

[tool.setuptools.packages.find]
include = ["fluent_data_studio", "fluent_data_studio.engine", "fluent_data_studio.engine.*"]

[tool.setuptools.package-data]
fluent_data_studio = ["datasets/*.csv", "datasets/*.json"]
